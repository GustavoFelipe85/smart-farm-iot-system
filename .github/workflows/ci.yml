name: CI Reduzida - Smart Farm IoT System

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "docker/**"
      - "requirements.txt"
      - ".github/workflows/ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "docker/**"
      - "requirements.txt"
      - ".github/workflows/ci.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  software-validation:
    name: Validação de Software
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências
        shell: bash
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          pip install pytest jsonschema

      - name: Verificar sintaxe Python
        run: |
          python -m compileall -q src

      - name: Validar JSON Schema
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from jsonschema import Draft7Validator

          schema_path = Path(
              "src/backend/schemas/sensor_payload.json"
          )

          if not schema_path.exists():
              raise FileNotFoundError(
                  f"Schema não encontrado: {schema_path.resolve()}"
              )

          schema = json.loads(
              schema_path.read_text(encoding="utf-8")
          )

          Draft7Validator.check_schema(schema)

          print("JSON Schema válido.")
          PY

      - name: Executar testes sem hardware
        shell: bash
        run: |
          if find tests -type f -name "test_*.py" 2>/dev/null | grep -q .; then
             pytest tests -v -m "not hardware and not integration"
          else
            echo "Nenhum teste automatizado encontrado em tests/."
          fi

      - name: Validar Docker Compose
        shell: bash
        run: |
          if [ -f docker/docker-compose.yml ]; then
            docker compose -f docker/docker-compose.yml config -q
          elif [ -f docker/compose.yml ]; then
            docker compose -f docker/compose.yml config -q
          elif [ -f docker-compose.yml ]; then
            docker compose -f docker-compose.yml config -q
          elif [ -f compose.yml ]; then
            docker compose -f compose.yml config -q
          else
            echo "Arquivo Docker Compose não encontrado."
            exit 1
          fi

