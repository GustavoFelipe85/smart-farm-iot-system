name: DevSecOps CI - Smart Farm IoT System

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "docker/**"
      - "requirements.txt"
      - ".github/workflows/ci.yml"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  software-and-security-validation:
    name: Validação de Software e SecOps
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necessário para o Gitleaks varrer todo o histórico do push

      - name: Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências (App + SAST)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest jsonschema bandit

      - name: SAST - Análise Estática de Vulnerabilidades (Bandit)
        run: |
          bandit -r src/ -ll -ii

      - name: Validar JSON Schema
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft7Validator
          
          schema_path = Path("src/backend/schemas/sensor_payload.json")
          if not schema_path.exists():
              raise FileNotFoundError(f"Schema não encontrado: {schema_path.resolve()}")
              
          schema = json.loads(schema_path.read_text(encoding="utf-8"))
          Draft7Validator.check_schema(schema)
          print("JSON Schema válido e consistente.")
          PY

      - name: Executar testes isolados (Sem Hardware)
        shell: bash
        run: |
          if find tests -type f -name "test_*.py" 2>/dev/null | grep -q .; then
             pytest tests -v -m "not hardware and not integration"
          else
            echo "Nenhum teste automatizado isolado encontrado."
          fi

      - name: Validar Arquitetura Docker Compose
        shell: bash
        run: |
          COMPOSE_FILE=$(find . -maxdepth 2 -name "docker-compose.yml" -o -name "compose.yml" | head -n 1)
          if [ -n "$COMPOSE_FILE" ]; then
            docker compose -f "$COMPOSE_FILE" config -q
            echo "Topologia Docker validada com sucesso."
          else
            echo "Arquivo Docker Compose não encontrado no escopo."
            exit 1
          fi
