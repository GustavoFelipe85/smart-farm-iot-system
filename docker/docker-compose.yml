version: "3.8"

networks:
  iot-network:
    driver: bridge

volumes:
  influx-data:
  grafana-data:
  mosquitto-data:
  mosquitto-log:

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/passwords:/mosquitto/config/passwords:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mosquitto -c /mosquitto/config/mosquitto.conf -v >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks: [ iot-network ]

  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUX_TOKEN}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUX_ORG}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUX_BUCKET}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUX_TOKEN}
    volumes:
      - influx-data:/var/lib/influxdb2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8086/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks: [ iot-network ]

  grafana:
    image: grafana/grafana:10.4.2
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ../dashboards/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ../dashboards/provisioning/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
      - ../dashboards:/var/lib/grafana/dashboards
    depends_on: [ influxdb ]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks: [ iot-network ]

  api:
    image: python:3.11-slim
    container_name: smartfarm-api
    working_dir: /app
    volumes:
      - ../src/backend:/app
      - ../src/backend/schemas:/app/schemas
    command: sh -c "pip install -r requirements.txt && uvicorn api.app:app --host ${API_HOST} --port ${API_PORT}"
    environment:
      - INFLUX_URL=${INFLUX_URL}
      - INFLUX_ORG=${INFLUX_ORG}
      - INFLUX_BUCKET=${INFLUX_BUCKET}
      - INFLUX_TOKEN=${INFLUX_TOKEN}
      - MQTT_BROKER=${MQTT_BROKER}
      - MQTT_PORT=${MQTT_PORT}
      - MQTT_USERNAME=${MQTT_USERNAME}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
    depends_on: [ influxdb, mosquitto ]
    ports:
      - "8000:8000"
    networks: [ iot-network ]

  consumer:
    image: python:3.11-slim
    container_name: smartfarm-consumer
    working_dir: /app
    volumes:
      - ../src/backend:/app
      - ../src/backend/schemas:/app/schemas
    command: sh -c "pip install -r requirements.txt && python python-consumer/main.py"
    environment:
      - INFLUX_URL=${INFLUX_URL}
      - INFLUX_ORG=${INFLUX_ORG}
      - INFLUX_BUCKET=${INFLUX_BUCKET}
      - INFLUX_TOKEN=${INFLUX_TOKEN}
      - MQTT_BROKER=${MQTT_BROKER}
      - MQTT_PORT=${MQTT_PORT}
      - MQTT_USERNAME=${MQTT_USERNAME}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
    depends_on: [ influxdb, mosquitto ]
    networks: [ iot-network ]
